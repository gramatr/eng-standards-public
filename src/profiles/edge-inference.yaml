_meta:
  name: edge-inference
  description: FastAPI inference service — NVIDIA Jetson (Orin) and RTX 4090 GPU nodes on k3s

standards:
  - python
  - docker
  - kubernetes
  - security

coverage: coverage/thresholds.json

notes:
  gpu_target: nvidia.com/gpu resource requests required (see kubernetes.gpu_resource_requests_for_inference)
  triton: Triton Inference Server model repos served from Ceph RBD PVCs — not baked into image
  compute_caps: Jetson Orin=87 (sm_87), RTX 4090=89 (sm_89) — must match CUDA arch in Dockerfile
  framework: FastAPI (async) with uvicorn — not Flask; async required for concurrent inference requests

templates:
  - templates/CLAUDE.python.md
